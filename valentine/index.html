<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .hearts-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
            }
        }

        /* Main container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 135, 0.4);
            max-width: 600px;
            z-index: 10;
            position: relative;
        }

        .heart-icon {
            font-size: 80px;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(1.1);
            }
            20%, 40% {
                transform: scale(1);
            }
        }

        h1 {
            color: #ff1744;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255, 23, 68, 0.2);
        }

        .question {
            font-size: 1.8em;
            color: #d81b60;
            margin-bottom: 40px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 20px 50px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff1744 0%, #f50057 100%);
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.5);
        }

        #noBtn {
            background: linear-gradient(135deg, #bdbdbd 0%, #757575 100%);
            color: white;
            position: absolute;
            transition: all 0.2s ease;
        }

        #noBtn:hover {
            transform: scale(0.95);
        }

        /* Success message */
        .success-message {
            display: none;
            animation: fadeIn 1s ease-in;
        }

        .success-message.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .romantic-message {
            font-size: 1.8em;
            color: #ff1744;
            margin: 30px 0;
            line-height: 1.6;
        }

        .love-gif {
            width: 300px;
            max-width: 100%;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(255, 23, 68, 0.3);
        }

        /* Confetti hearts */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-heart {
            position: absolute;
            font-size: 40px;
            animation: fall 3s linear forwards;
            opacity: 0;
        }

        @keyframes fall {
            0% {
                top: -10%;
                opacity: 1;
                transform: rotate(0deg);
            }
            100% {
                top: 110%;
                opacity: 0.5;
                transform: rotate(360deg);
            }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .question {
                font-size: 1.4em;
            }

            button {
                padding: 15px 35px;
                font-size: 1.2em;
            }

            .heart-icon {
                font-size: 60px;
            }
        }

        /* Audio control */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 23, 68, 0.8);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            z-index: 1000;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .audio-control.show {
            display: block;
        }

        .audio-control:hover {
            background: rgba(255, 23, 68, 1);
        }
    </style>
</head>
<body>
    <!-- Background floating hearts -->
    <div class="hearts-background" id="bgHearts"></div>

    <!-- Confetti container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Main container -->
    <div class="container">
        <div id="questionContent">
            <div class="heart-icon">💖</div>
            <h1>Hey There! 💕</h1>
            <p class="question">Will you be my Valentine?</p>
            <div class="buttons-container">
                <button id="yesBtn">Yes! 💝</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div id="successMessage" class="success-message">
            <div class="heart-icon">💕</div>
            <p class="romantic-message">
                Yay! You made my day! 💖<br>
                I'm so happy you said yes! 🥰<br>
                You're the best Valentine ever! 💝
            </p>
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbGw3dzBkZ3l5ZDR2cDJ5OGNhYWRyZWh5cHF5cHF5cHF5cHF5cHF5cCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o6Zt6ML6BklJJPnGU/giphy.gif" alt="Love" class="love-gif" onerror="this.style.display='none'">
            <div style="margin-top: 20px; font-size: 1.2em; color: #d81b60;">
                💕 Happy Valentine's Day! 💕
            </div>
        </div>
    </div>

    <!-- Audio control button -->
    <button class="audio-control" id="audioControl">🔊 Music ON</button>

    <!-- Audio element (we'll use a romantic melody) -->
    <audio id="romanticMusic" loop>
        <!-- Using a free romantic music URL - you can replace with your own -->
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-piano-132.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Initialize
        let noBtnSize = 100; // percentage
        let noBtnHoverCount = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionContent = document.getElementById('questionContent');
        const successMessage = document.getElementById('successMessage');
        const audio = document.getElementById('romanticMusic');
        const audioControl = document.getElementById('audioControl');
        let musicPlaying = false;

        // Create floating hearts in background
        function createBackgroundHearts() {
            const container = document.getElementById('bgHearts');
            const heartEmojis = ['💕', '💖', '💗', '💝', '💓', '💞', '💘'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
                container.appendChild(heart);
            }
        }

        // Move and shrink No button on hover
        noBtn.addEventListener('mouseover', function() {
            noBtnHoverCount++;
            
            // Get button dimensions
            const btnRect = noBtn.getBoundingClientRect();
            const containerRect = document.querySelector('.buttons-container').getBoundingClientRect();
            
            // Calculate available space for movement
            const maxX = window.innerWidth - btnRect.width - 50;
            const maxY = window.innerHeight - btnRect.height - 50;
            
            // Random position
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            // Decrease size (minimum 30%)
            noBtnSize = Math.max(30, noBtnSize - 8);
            
            // Apply transformations
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transform = `scale(${noBtnSize / 100})`;
            
            // Make Yes button bigger after several hovers
            if (noBtnHoverCount > 3) {
                yesBtn.style.transform = 'scale(1.2)';
            }
            
            // After many attempts, make No button tiny and show hint
            if (noBtnHoverCount > 7) {
                noBtn.textContent = '😢';
                noBtn.style.fontSize = '0.8em';
            }
        });

        // Yes button click handler
        yesBtn.addEventListener('click', function() {
            // Hide question, show success message
            questionContent.style.display = 'none';
            successMessage.classList.add('show');
            
            // Create confetti hearts
            createConfetti();
            
            // Play romantic music
            playMusic();
            
            // Change background to more romantic
            document.body.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #c06c84 50%, #f67280 100%)';
        });

        // Create confetti hearts
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const heartEmojis = ['❤️', '💕', '💖', '💗', '💝', '💓', '💞', '💘', '🌹'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'confetti-heart';
                    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    heart.style.animationDelay = (Math.random() * 0.5) + 's';
                    container.appendChild(heart);
                    
                    // Remove heart after animation
                    setTimeout(() => {
                        heart.remove();
                    }, 4000);
                }, i * 100);
            }
        }

        // Play romantic music
        function playMusic() {
            audio.play().catch(err => {
                console.log('Audio playback failed:', err);
                // Show control button if autoplay fails
                audioControl.classList.add('show');
            });
            musicPlaying = true;
            audioControl.classList.add('show');
            audioControl.textContent = '🔊 Music ON';
        }

        // Audio control toggle
        audioControl.addEventListener('click', function() {
            if (musicPlaying) {
                audio.pause();
                audioControl.textContent = '🔇 Music OFF';
                musicPlaying = false;
            } else {
                audio.play();
                audioControl.textContent = '🔊 Music ON';
                musicPlaying = true;
            }
        });

        // Initialize background hearts
        createBackgroundHearts();

        // Position No button initially
        window.addEventListener('load', function() {
            // Set initial position for No button
            noBtn.style.position = 'relative';
        });
    </script>
</body>
</html>
